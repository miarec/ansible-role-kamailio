  hosts: all
  become: true

  vars:
    kamailio_config_file_content: "{{ lookup('template', playbook_dir ~ '/../default/templates/kamailio.cfg.j2') }}"

  roles:
    - role: "{{ playbook_dir }}/../.." # noqa: role-name[path]
